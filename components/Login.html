<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaAsset — Вход</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
    }

    .login-wrap {
      width: 100%;
      max-width: 380px;
      padding: 1rem;
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
      justify-content: center;
    }

    .login-logo-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }

    .login-logo-icon svg { width: 20px; height: 20px; }

    .login-logo-name {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
    }

    .login-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-input {
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-primary);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    .form-input:focus { border-color: var(--accent-mid); }

    .login-btn {
      width: 100%;
      height: 40px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }

    .login-btn:hover { background: var(--accent-mid); }
    .login-btn:disabled { opacity: 0.6; cursor: default; }

    .login-error {
      background: var(--status-repair-bg);
      border: 1px solid var(--status-repair-border);
      color: var(--status-repair-text);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-icon">
      <svg viewBox="0 0 16 16" fill="none">
        <rect x="1" y="3" width="9" height="7" rx="1" stroke="white" stroke-width="1.3"/>
        <path d="M10 6.5l4-2v7l-4-2V6.5z" stroke="white" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M3 12h6" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M6 12v2" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="login-logo-name">MediaAsset</span>
  </div>

  <div class="login-card">
    <div class="login-title">Вход в систему</div>
    <div class="login-sub">Учёт мультимедийного оборудования</div>

    <div class="login-error" id="loginError"></div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Пароль</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" />
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">Войти</button>
  </div>
</div>

<script>
  // Если уже авторизован — редиректим
  fetch('/api/auth/me', {credentials: "include"})
    .then(r => { if (r.ok) window.location.href = '/index.html'; })
    .catch(() => {});

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl    = document.getElementById('loginError');
    const btn      = document.getElementById('loginBtn');

    errEl.style.display = 'none';

    if (!email || !password) {
      showError('Введите email и пароль');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Вход…';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Ошибка входа');
        return;
      }

      // Сохраняем данные пользователя (не токен — он в httpOnly cookie)
      sessionStorage.setItem('user', JSON.stringify(data));

      // Редиректим по роли
      if (data.role === 'admin') {
        window.location.href = '/index.html';
      } else if (data.role === 'manager') {
        window.location.href = '/Events.html';
      } else {
        window.location.href = '/index.html';
      }
    } catch {
      showError('Не удалось подключиться к серверу');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  }

  function showError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.style.display = 'block';
  }
</script>
</body>
</html>
